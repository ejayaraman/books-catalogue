<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Library{% endblock %}</title>
  <script>
    (function () {
      var stored = localStorage.getItem("catalogue-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="{{ asset_base }}/static/css/base.css">
  <link rel="stylesheet" href="{{ asset_base }}/static/css/theme.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ asset_base }}/index.html">My Library</a>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">🌓</button>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Generated by Personal Library Catalogue Generator</p>
  </footer>

  <script type="module" src="{{ asset_base }}/static/js/theme.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
